name: "Tinyproxy"
version: "1.0.4"
slug: tinyproxy
image: ghcr.io/cavamora/ha-tinyproxy-{arch}
description: "Lightweight HTTP/HTTPS forward proxy — e.g. residential egress for remote machines over Tailscale"
url: "https://github.com/cavamora/ha-tinyproxy"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  port: 8888
  allowed_clients:
    - "100.64.0.0/10"
  connect_ports:
    - 443
    - 80
  disable_via_header: true
  # Connect logs each accepted proxy connection without the full Info-level noise.
  # Named tinyproxy_log_level to avoid hassio-addons/base interpreting a generic
  # log_level option; that base service does not accept Tinyproxy's "Connect" level.
  tinyproxy_log_level: Connect
  max_clients: 20
  timeout: 600
schema:
  port: port
  allowed_clients:
    - str
  connect_ports:
    - int
  disable_via_header: bool
  tinyproxy_log_level: list(Critical|Error|Warning|Notice|Connect|Info)
  max_clients: int(1,)
  timeout: int(1,)
