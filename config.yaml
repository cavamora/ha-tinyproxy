name: "Tinyproxy"
version: "1.0.2"
slug: tinyproxy
description: "Lightweight HTTP/HTTPS forward proxy — e.g. residential egress for remote machines over Tailscale"
url: "https://github.com/cavamora/ha-tinyproxy"
arch:
  - aarch64
  - amd64
init: false
host_network: true
options:
  port: 8888
  allowed_clients:
    - "100.64.0.0/10"
  connect_ports:
    - 443
    - 80
  disable_via_header: true
  # Connect logs each accepted proxy connection without the full Info-level noise.
  # Tinyproxy runs in foreground and, with no LogFile/Syslog directive, writes to
  # stdout/stderr; HAOS journald captures that and Grafana Alloy ships it to Loki.
  log_level: Connect
  max_clients: 20
  timeout: 600
schema:
  port: port
  allowed_clients:
    - str
  connect_ports:
    - int
  disable_via_header: bool
  log_level: list(Critical|Error|Warning|Notice|Connect|Info)
  max_clients: int(1,)
  timeout: int(1,)
